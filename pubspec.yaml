name: three_lines
description: 하루 3줄 마이크로 저널 앱
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.3.0
  drift: ^2.34.0
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^1.0.0
  flutter_local_notifications: ^22.0.1
  intl: ^0.20.0
  share_plus: ^12.0.0
  package_info_plus: ^9.0.0
  timezone: ^0.11.1
  file_picker: ^11.0.0
  local_auth: ^3.0.0
  image_picker: ^1.2.2
  pdf: ^3.12.0
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  sqlite3: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # 나눔명조(OFL): PDF 월간 리포트 한글 렌더링용 번들 폰트.
    - assets/fonts/NanumMyeongjo-Regular.ttf
    # OFL 라이선스 본문: 앱 내 오픈소스 라이선스 페이지에 노출.
    - assets/fonts/OFL.txt
    - assets/fonts/NotoSans-OFL.txt
  fonts:
    # Noto Sans(OFL) 가변폰트: UI 라틴/숫자 타이포. google_fonts 런타임 fetch 대신
    # 번들해 오프라인 결정적 로딩(첫 실행 FOUT/네트워크 의존 제거). 한글은 플랫폼 폰트.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
