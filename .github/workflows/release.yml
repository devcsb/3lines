name: Mobile release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the iOS IPA to TestFlight after a successful build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate version and tag
        run: dart run tool/release/validate_version.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    name: Build signed Android bundle
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Android signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/3lines-upload-keystore.jks
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required Android release secret: $variable" >&2
              exit 2
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=$KEYSTORE_PATH" > android/keystore.properties
      - name: Build signed AAB
        run: flutter build appbundle --release
      - name: Verify AAB signature
        run: tool/release/verify_android_artifact.sh build/app/outputs/bundle/release/app-release.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: 3lines-android-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: Build signed iOS archive
    needs: validate
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Synchronize CocoaPods
        working-directory: ios
        run: pod install --deployment
      - name: Prepare signing and archive
        env:
          IOS_RELEASE_ENV_FILE: ${{ runner.temp }}/3lines-ios-release.env
          ARCHIVE_PATH: ${{ runner.temp }}/3lines.xcarchive
        run: |
          set -euo pipefail
          tool/release/prepare_ios_signing.sh
          # The env file is shell-escaped by the preparation script.
          set -a
          # shellcheck disable=SC1090
          source "$IOS_RELEASE_ENV_FILE"
          set +a
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            IOS_RUNNER_PROVISIONING_PROFILE_SPECIFIER="$IOS_RUNNER_PROVISIONING_PROFILE_SPECIFIER" \
            IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER="$IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER"
          tool/release/generate_export_options.sh "$RUNNER_TEMP/3lines-export-options.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/3lines-export-options.plist" \
            -exportPath "$RUNNER_TEMP/3lines-export"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3lines-ios-${{ github.ref_name }}
          path: ${{ runner.temp }}/3lines-export/*.ipa
          if-no-files-found: error

  github-release:
    name: Publish GitHub release assets
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android bundle
        uses: actions/download-artifact@v4
        with:
          name: 3lines-android-${{ github.ref_name }}
          path: release-assets
      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: 3lines-ios-${{ github.ref_name }}
          path: release-assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  testflight:
    name: Upload iOS package to TestFlight
    needs: ios
    if: github.event_name == 'workflow_dispatch' && inputs.upload == true
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
    steps:
      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: 3lines-ios-${{ github.ref_name }}
          path: release-assets
      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          for variable in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required App Store Connect secret: $variable" >&2
              exit 2
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key_path"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$(find release-assets -name '*.ipa' -print -quit)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
